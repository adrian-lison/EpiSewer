# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: mixin
displayName: EpiSewer dev environment
description: >-
  R + CmdStan toolchain (conda env built from .devenv/env.yml) for developing,
  testing and linting the EpiSewer R package and its Stan models.

capabilities:
  - type: com.docker.sandbox/network-policy@1
    description: CRAN, GitHub (remotes), r-universe and conda-forge for package installs
    config:
      runtime:
        allow:
          - cloud.r-project.org
          - "*.r-project.org"
          - "*.r-universe.dev"
          - github.com
          - api.github.com
          - codeload.github.com
          - "*.githubusercontent.com"
          - conda.anaconda.org
          - "*.anaconda.org"
          - mc-stan.org
          # pkgdown::build_site(): JS/CSS assets from CDNs, and package lookup
          # on Bioconductor (for the sidebar links)
          - cdnjs.cloudflare.com
          - cdn.jsdelivr.net
          - www.bioconductor.org
          # cross-package links in reference pages (other packages' pkgdown sites)
          - "*.r-lib.org"
          - "*.tidyverse.org"

  - type: com.docker.sandbox/lifecycle@1
    config:
      startup:
        # Runs on every sandbox start, in the background (the clone is not yet
        # available at install time). Log: /tmp/episewer-check-deps.log
        - command: ["/bin/bash", "-c", "/opt/episewer-env/bin/episewer-check-deps --install > /tmp/episewer-check-deps.log 2>&1"]
          user: "1000"
          background: true
          description: Check that all DESCRIPTION dependencies are installed (installs missing ones from CRAN)

  - type: com.docker.sandbox/agent-context@1
    config:
      contentFile: ./sbx/context.md
